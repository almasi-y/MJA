<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Website</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="animation.css">
        <link rel="stylesheet" href="default.css">
        
    </head>
    <body>
        <p>This is my paragraph inside my body</p>
        <header>
            <h1>🏆 My favourite things 🏆</h1>

        <main>
            <section>
                <h2>Lists of my favourite things</h2>
            </section>
            <section>
                <p>My favourite ways to make art:</p>
            </section>
            <section>
                <img src="painting.png" alt="A painting" />

                    <li>Watercolour</li>
                    <li>Digital</li>
                    <li>Fine liners</li>
                </ol>
                <img src="mandala.png" alt="A mandala drawing" />

            <section class="tertiary">
                <p>My favourite places to travel:</p>
            </section>
            <section class="wrap">  
                <img class="rollmeright" src="paris.png" alt=""/>

                    <li>Paris</li>
                    <li>New York</li>
                    <li>Tokyo</li>
                </ol>
                <img class="rollmeleft" src="aeroplane.jpeg" alt=""/>

            <section class="tertiary">
                <p>My favourite animals:</p>
            </section>
            <section class="wrap">  
                <img class="rollmeright" src="dogs.jpeg" alt=""/>
                <ol class="wide">
                    <li>Cats</li>
                    <li>Dogs</li>
                    <li>Birs</li>
                </ol>
